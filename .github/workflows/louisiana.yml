name: Louisiana setup

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in pipeline/ to run"
        default: "la_fetch.py"

permissions:
  contents: write

concurrency:
  group: funding-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install pymupdf

      - name: Run the Louisiana step
        run: python -I pipeline/${{ inputs.script }}

      # Request pages stay on this temporary server. .gitignore keeps them out of the repository.
      - name: Save public documents and extracted data
        run: |
          git config user.name "funding-atlas-bot"
          git config user.email "funding-atlas-bot@users.noreply.github.com"
          git add data/raw/louisiana_bills data/raw/louisiana_acts data/derived 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update Louisiana source documents"
          git pull --rebase
          git push
