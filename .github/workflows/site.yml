name: Publish the website

# Publishes page and checklist changes right away, without waiting for a data update.
on:
  push:
    branches: [main]
    paths:
      - "web/index.html"
      - "web/data/requirements.json"
      - "web/data/site-config.json"
      - "web/data/veto_notes.json"
      - "pipeline/site.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the website
        run: python -I pipeline/site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
